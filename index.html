<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Product preview card component</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
        position: relative;
        top: 50px;
      }
      .attribution a {
        color: hsla(228, 45%, 44%, 0.705);
      }
    </style>
  </head>
  <body>
    <div class="main-component">
      <section class="main-img">
        <img src="./images/image-product-desktop.jpg" alt="product image" />
      </section>
      <section class="main-content">
        <p class="perfume-text">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p>
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <div class="price">
          <h1 class="new-price">$149.99</h1>
          <p class="old-price">$169.99</p>
        </div>
        <button>
          <img src="./images/icon-cart.svg" alt="" />
          <p>Add to Cart</p>
        </button>
      </section>
    </div>

    <div class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io/challenges/product-preview-card-component-GO7UmttRfa"
        target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="https://github.com/webdevsuman">Suman Das</a>.
    </div>
  </body>
</html>
